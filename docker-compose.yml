services:
  postgres-auth:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-events:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: events
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-bookings:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookings
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_NUM_PARTITIONS: "1"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  auth:
    build:
      context: .
      dockerfile: Dockerfile.Auth
    depends_on:
      postgres-auth:
        condition: service_healthy
    environment:
      ConnectionStrings__AuthDbConnection: "Host=postgres-auth;Port=5432;Database=auth;Username=postgres;Password=postgres"
      Kafka__BaseUrl: "kafka:9092"
      Kafka__Login: ""
      Kafka__Password: ""
    ports:
      - "5001:8080"

  events:
    build:
      context: .
      dockerfile: Dockerfile.Events
    depends_on:
      postgres-events:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      ConnectionStrings__EventsDbConnection: "Host=postgres-events;Port=5432;Database=events;Username=postgres;Password=postgres"
      Kafka__BaseUrl: "kafka:9092"
      Kafka__Login: ""
      Kafka__Password: ""
    ports:
      - "5002:8080"

  bookings:
    build:
      context: .
      dockerfile: Dockerfile.Bookings
    depends_on:
      postgres-bookings:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      ConnectionStrings__EventsDbConnection: "Host=postgres-bookings;Port=5432;Database=bookings;Username=postgres;Password=postgres"
      Kafka__BaseUrl: "kafka:9092"
      Kafka__Login: ""
      Kafka__Password: ""
    ports:
      - "5003:8080"
