name: Build Backend

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            **/bin/Release/
            **/obj/
          retention-days: 1

  unit-tests:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .

      - name: Run Unit Tests
        run: |
          dotnet test TicketNest.Auth.Tests/TicketNest.Auth.Tests.csproj --configuration Release
          dotnet test TicketNest.Events.Tests/TicketNest.Events.Tests.csproj --configuration Release
          dotnet test TicketNest.Bookings.Tests/TicketNest.Bookings.Tests.csproj --configuration Release
          dotnet test TicketNest.Shared.Tests/TicketNest.Shared.Tests.csproj --configuration Release

  integration-tests:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .

      - name: Run Integration Tests
        run: |
          dotnet test TicketNest.Events.IntegrationTests/TicketNest.Events.IntegrationTests.csproj --configuration Release
          dotnet test TicketNest.Kafka.IntegrationTests/TicketNest.Kafka.IntegrationTests.csproj --configuration Release